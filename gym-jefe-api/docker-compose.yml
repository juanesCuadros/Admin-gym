services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gymos_jefe_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PROJECT_NAME: "GymOS - Sistema Web del Gimnasio"
      VERSION: "1.0.0"
      ENVIRONMENT: "development"
      DEBUG: "True"
      DATABASE_URL: "postgresql+asyncpg://gymos_platform:gymos_secret_2026@host.docker.internal:5432/gymos_db"
      JWT_SECRET_KEY: "gymos_platform_super_secret_jwt_key_development_2026"
      JWT_ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      TIMEZONE: "America/Bogota"
      CORS_ORIGINS: '["http://localhost:3000", "http://localhost:5173", "http://localhost:8000", "app://electron"]'
      BIOMETRIC_ENCRYPTION_KEY: "eb81985a644cba241a6ba4ac5a7be9c43dd689b7df08103e7b86c21ddb28b124"
    extra_hosts:
      - "host.docker.internal:host-gateway"
