server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Cabeceras de seguridad.
    # OJO: nginx no hereda add_header del server si la location define los suyos,
    # por eso se repiten en cada location que agrega Cache-Control.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Caché de recursos estáticos (Vite pone hash en los nombres de /assets/)
    location ~* \.(?:css|js|woff2?|eot|ttf|otf|ico|png|jpg|jpeg|gif|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    # Proxy de la API.
    # Los endpoints públicos (/api/v1/public/...) viven en super-admin-api.
    # proxy_pass con variable + resolver de Docker: la IP de `super-admin-api` se vuelve a consultar cada 30 s.
    # Con el nombre fijo, nginx la resolvía solo al arrancar y, al recrear la API, seguía enviando a la IP vieja.
    # Con variable y sin URI, nginx pasa la ruta original (/api/...) sin cambios.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $gymos_api http://super-admin-api:8000;

    location /api/ {
        proxy_pass $gymos_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # SPA: cualquier otra ruta sirve index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
