# ==============================================================================
# GymOS — bloques `server` para el nginx de borde de resttodash (dueño de 80/443).
#
# Este archivo NO es un nginx propio: se incluye dentro del bloque `http {}` del nginx de resttodash
#   include /etc/nginx/gymos/gymos.conf;
# montando esta carpeta en su contenedor (ver docs/DEPLOYMENT_VPS.md, "nginx y HTTPS").
#
# - Los frontends de GymOS están en la red Docker `resttodash` con alias gymos-sitio, gymos-admin y
#   gymos-web. Cada frontend ya hace proxy de /api/ a su API; aquí solo se apunta al frontend.
# - proxy_pass con variable + resolver de Docker: si GymOS está caído, el nginx de resttodash igual arranca
#   (responde 502 solo en los hosts de GymOS) en vez de fallar entero.
# - Certificado: uno solo (SAN) en /etc/letsencrypt/live/gymdeskcolombia.com, emitido por webroot.
#   Cada gimnasio nuevo exige ampliarlo con su host (runbook, "Agregar un gimnasio").
# - Validar SIEMPRE antes de recargar: docker exec resttodash-nginx nginx -t
# ==============================================================================

map $http_upgrade $gymos_connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------- HTTP: desafío de Let's Encrypt y redirección a HTTPS ----------
server {
    listen 80;
    server_name gymdeskcolombia.com www.gymdeskcolombia.com admin.gymdeskcolombia.com
                ~^[a-z0-9][a-z0-9-]*\.gymdeskcolombia\.com$;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ---------- Sitio público: gymdeskcolombia.com (www redirige al dominio raíz) ----------
server {
    listen 443 ssl;
    server_name www.gymdeskcolombia.com;
    ssl_certificate     /etc/letsencrypt/live/gymdeskcolombia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gymdeskcolombia.com/privkey.pem;
    return 301 https://gymdeskcolombia.com$request_uri;
}

server {
    listen 443 ssl;
    server_name gymdeskcolombia.com;
    ssl_certificate     /etc/letsencrypt/live/gymdeskcolombia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gymdeskcolombia.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $gymos_sitio http://gymos-sitio:80;

    location / {
        proxy_pass $gymos_sitio;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# ---------- Super Admin: admin.gymdeskcolombia.com ----------
server {
    listen 443 ssl;
    server_name admin.gymdeskcolombia.com;
    ssl_certificate     /etc/letsencrypt/live/gymdeskcolombia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gymdeskcolombia.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Logos de gimnasios y archivos que suba el Super Admin.
    client_max_body_size 10m;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $gymos_admin http://gymos-admin:80;

    location / {
        proxy_pass $gymos_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

# ---------- Sistema Web de cada gimnasio: {subdominio}.gymdeskcolombia.com ----------
# Los nombres exactos de arriba (www, admin) tienen prioridad sobre esta expresión regular.
server {
    listen 443 ssl;
    server_name ~^[a-z0-9][a-z0-9-]*\.gymdeskcolombia\.com$;
    ssl_certificate     /etc/letsencrypt/live/gymdeskcolombia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gymdeskcolombia.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Carga inicial de clientes (CSV/Excel hasta 5 MB) y logos.
    client_max_body_size 10m;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $gymos_web http://gymos-web:80;

    location / {
        proxy_pass $gymos_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # WebSocket de la Pantalla TV (/api/v1/pantalla-tv/ws/{subdominio} y similares): conexión larga.
    location ~ ^/api/v1/.*/ws/ {
        proxy_pass $gymos_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $gymos_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
